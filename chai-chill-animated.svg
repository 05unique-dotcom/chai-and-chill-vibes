<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="500" height="200">
  <defs>
    <style>
      /* Background */
      .bg { fill: #FFF8F0; }
      
      /* Steam animations */
      @keyframes steam1 {
        0% { transform: translateY(0) scaleX(1); opacity: 0.8; }
        50% { transform: translateY(-20px) scaleX(1.3); opacity: 0.4; }
        100% { transform: translateY(-40px) scaleX(0.8); opacity: 0; }
      }
      @keyframes steam2 {
        0% { transform: translateY(0) scaleX(1); opacity: 0.6; }
        50% { transform: translateY(-25px) scaleX(0.8); opacity: 0.3; }
        100% { transform: translateY(-45px) scaleX(1.2); opacity: 0; }
      }
      .steam1 { animation: steam1 2s ease-out infinite; }
      .steam2 { animation: steam2 2.3s ease-out infinite 0.3s; }
      .steam3 { animation: steam1 1.8s ease-out infinite 0.6s; }

      /* Bounce animations */
      @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-12px); }
      }
      @keyframes bounce2 {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      @keyframes bounce3 {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-14px); }
      }
      @keyframes bounce4 {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
      .chai { animation: bounce 1.8s ease-in-out infinite; }
      .samosa { animation: bounce2 2.1s ease-in-out infinite 0.3s; }
      .vadapav { animation: bounce3 1.6s ease-in-out infinite 0.6s; }
      .poha { animation: bounce4 2.4s ease-in-out infinite 0.9s; }

      /* Wave/wiggle for faces */
      @keyframes wiggle {
        0%, 100% { transform: rotate(-5deg); }
        50% { transform: rotate(5deg); }
      }
      .face { animation: wiggle 1s ease-in-out infinite; }

      /* Stars twinkling */
      @keyframes twinkle {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.6); }
      }
      .star1 { animation: twinkle 1.2s ease-in-out infinite; }
      .star2 { animation: twinkle 1.5s ease-in-out infinite 0.4s; }
      .star3 { animation: twinkle 0.9s ease-in-out infinite 0.8s; }

      /* Floating hearts */
      @keyframes floatHeart {
        0% { transform: translateY(0) scale(1); opacity: 1; }
        100% { transform: translateY(-40px) scale(0.5); opacity: 0; }
      }
      .heart1 { animation: floatHeart 2s ease-out infinite; }
      .heart2 { animation: floatHeart 2s ease-out infinite 0.7s; }
      .heart3 { animation: floatHeart 2s ease-out infinite 1.4s; }

      /* Text pulse */
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
      }
      .tagline { animation: pulse 2s ease-in-out infinite; }

      /* Slide in */
      @keyframes slideIn {
        0% { transform: translateX(-30px); opacity: 0; }
        100% { transform: translateX(0); opacity: 1; }
      }
      .title { animation: slideIn 0.8s ease-out forwards; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="500" height="200" class="bg" rx="16"/>
  
  <!-- Warm gradient overlay bottom -->
  <rect width="500" height="40" y="160" rx="0" fill="#FFE4C4" opacity="0.4"/>

  <!-- Title -->
  <text x="250" y="30" font-family="Georgia, serif" font-size="22" font-weight="bold" 
        fill="#8B4513" text-anchor="middle" class="title">☕ Chai &amp; Chill</text>
  <text x="250" y="50" font-family="Arial, sans-serif" font-size="10" 
        fill="#D2691E" text-anchor="middle" class="tagline">Mumbai Street Food • Est. 1985</text>

  <!-- ===== CHAI CUP ===== -->
  <g class="chai" transform="translate(60, 70)">
    <!-- Saucer -->
    <ellipse cx="0" cy="52" rx="28" ry="6" fill="#D2691E" opacity="0.5"/>
    <!-- Cup body -->
    <path d="M-18 15 L-20 48 Q0 55 20 48 L18 15 Z" fill="#E8622A"/>
    <path d="M-18 15 L18 15 Q15 8 0 8 Q-15 8 -18 15Z" fill="#FF8C42"/>
    <!-- Tea inside -->
    <ellipse cx="0" cy="15" rx="17" ry="5" fill="#8B4513"/>
    <!-- Cup handle -->
    <path d="M20 25 Q35 25 35 35 Q35 45 20 42" stroke="#D2691E" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Steam -->
    <path d="M-8 6 Q-5 -2 -8 -10" class="steam1" stroke="#888" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M0 4 Q3 -5 0 -14" class="steam2" stroke="#888" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M8 6 Q11 -2 8 -10" class="steam3" stroke="#888" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>
    <!-- Cute face -->
    <g class="face">
      <circle cx="-5" cy="30" r="2" fill="#fff" opacity="0.9"/>
      <circle cx="5" cy="30" r="2" fill="#fff" opacity="0.9"/>
      <path d="M-5 38 Q0 43 5 38" stroke="#fff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    </g>
    <!-- Label -->
    <text x="0" y="72" font-family="Arial" font-size="9" fill="#8B4513" text-anchor="middle" font-weight="bold">Chai ₹25</text>
  </g>

  <!-- ===== SAMOSA ===== -->
  <g class="samosa" transform="translate(175, 75)">
    <!-- Samosa triangle -->
    <polygon points="0,-40 -30,25 30,25" fill="#DAA520"/>
    <polygon points="0,-40 -30,25 30,25" fill="none" stroke="#B8860B" stroke-width="2"/>
    <!-- Texture lines -->
    <line x1="-15" y1="-10" x2="15" y2="-10" stroke="#B8860B" stroke-width="1.5" opacity="0.6"/>
    <line x1="-20" y1="5" x2="20" y2="5" stroke="#B8860B" stroke-width="1.5" opacity="0.6"/>
    <line x1="-25" y1="18" x2="25" y2="18" stroke="#B8860B" stroke-width="1.5" opacity="0.6"/>
    <!-- Cute face -->
    <g class="face">
      <circle cx="-6" cy="5" r="2.5" fill="#8B4513" opacity="0.8"/>
      <circle cx="6" cy="5" r="2.5" fill="#8B4513" opacity="0.8"/>
      <path d="M-5 13 Q0 18 5 13" stroke="#8B4513" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    </g>
    <!-- Chutney dip -->
    <ellipse cx="0" cy="28" rx="20" ry="5" fill="#228B22" opacity="0.6"/>
    <!-- Label -->
    <text x="0" y="45" font-family="Arial" font-size="9" fill="#8B4513" text-anchor="middle" font-weight="bold">Samosa ₹30</text>
  </g>

  <!-- ===== VADA PAV ===== -->
  <g class="vadapav" transform="translate(310, 80)">
    <!-- Bottom bun -->
    <ellipse cx="0" cy="30" rx="32" ry="12" fill="#DEB887"/>
    <ellipse cx="0" cy="25" rx="32" ry="12" fill="#F4A460"/>
    <!-- Vada (potato patty) -->
    <ellipse cx="0" cy="16" rx="24" ry="9" fill="#DAA520"/>
    <ellipse cx="0" cy="13" rx="24" ry="9" fill="#CD853F"/>
    <!-- Green chutney layer -->
    <ellipse cx="0" cy="10" rx="28" ry="6" fill="#90EE90" opacity="0.8"/>
    <!-- Top bun -->
    <ellipse cx="0" cy="5" rx="30" ry="11" fill="#DEB887"/>
    <ellipse cx="0" cy="-2" rx="30" ry="11" fill="#F5DEB3"/>
    <!-- Sesame seeds -->
    <ellipse cx="-8" cy="-5" rx="2" ry="1" fill="#8B4513" opacity="0.6"/>
    <ellipse cx="0" cy="-7" rx="2" ry="1" fill="#8B4513" opacity="0.6"/>
    <ellipse cx="8" cy="-5" rx="2" ry="1" fill="#8B4513" opacity="0.6"/>
    <!-- Cute face on bun -->
    <g class="face">
      <circle cx="-7" cy="-1" r="2" fill="#8B4513" opacity="0.7"/>
      <circle cx="7" cy="-1" r="2" fill="#8B4513" opacity="0.7"/>
      <path d="M-5 6 Q0 10 5 6" stroke="#8B4513" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    </g>
    <!-- Label -->
    <text x="0" y="52" font-family="Arial" font-size="9" fill="#8B4513" text-anchor="middle" font-weight="bold">Vada Pav ₹40</text>
  </g>

  <!-- ===== POHA ===== -->
  <g class="poha" transform="translate(430, 78)">
    <!-- Bowl -->
    <path d="M-30 20 Q-32 45 0 50 Q32 45 30 20 Z" fill="#CD853F"/>
    <ellipse cx="0" cy="20" rx="30" ry="10" fill="#DEB887"/>
    <!-- Poha (flattened rice) - yellow -->
    <ellipse cx="0" cy="17" rx="25" ry="8" fill="#FFD700"/>
    <!-- Toppings -->
    <circle cx="-10" cy="14" r="3" fill="#90EE90" opacity="0.9"/>
    <circle cx="5" cy="12" r="2" fill="#FF6347" opacity="0.9"/>
    <circle cx="12" cy="15" r="2.5" fill="#90EE90" opacity="0.9"/>
    <circle cx="-3" cy="18" r="2" fill="#FF6347" opacity="0.8"/>
    <!-- Cute face -->
    <g class="face">
      <circle cx="-6" cy="16" r="2" fill="#8B4513" opacity="0.8"/>
      <circle cx="6" cy="16" r="2" fill="#8B4513" opacity="0.8"/>
      <path d="M-4 23 Q0 27 4 23" stroke="#8B4513" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    </g>
    <!-- Label -->
    <text x="0" y="65" font-family="Arial" font-size="9" fill="#8B4513" text-anchor="middle" font-weight="bold">Poha ₹50</text>
  </g>

  <!-- Floating hearts between characters -->
  <text x="118" y="95" font-size="14" class="heart1" fill="#FF6B6B">❤️</text>
  <text x="243" y="90" font-size="14" class="heart2" fill="#FF6B6B">❤️</text>
  <text x="373" y="92" font-size="14" class="heart3" fill="#FF6B6B">❤️</text>

  <!-- Twinkling stars -->
  <text x="30" y="65" font-size="12" class="star1">✨</text>
  <text x="155" y="60" font-size="10" class="star2">⭐</text>
  <text x="460" y="62" font-size="12" class="star3">✨</text>

  <!-- Bottom tagline -->
  <text x="250" y="185" font-family="Georgia, serif" font-size="11" 
        fill="#8B4513" text-anchor="middle" font-style="italic" class="tagline">
    "Your favorite street food, one sip away" 🇮🇳
  </text>
</svg>
